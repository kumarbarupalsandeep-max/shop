name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: golf-commerce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://golf_app:golf_test_only@localhost:5432/golf_commerce
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: golf_commerce
          POSTGRES_USER: golf_app
          POSTGRES_PASSWORD: golf_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golf_app -d golf_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint workspaces
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build workspaces
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Start API and smoke test
        run: |
          node backend/dist/main.js > /tmp/golf-api.log 2>&1 &
          echo $! > /tmp/golf-api.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://localhost:3001/api/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/golf-api.log
            exit 1
          fi
          curl --fail --max-time 5 http://localhost:3001/api/v1/health
          curl --fail --max-time 5 http://localhost:3001/api/v1/health/ready
          curl --fail --max-time 5 http://localhost:3001/api/v1/catalog/categories
          curl --fail --max-time 5 "http://localhost:3001/api/v1/catalog/products?page=1&limit=20"
          curl --fail --max-time 5 "http://localhost:3001/api/v1/catalog/facets"
