services:
  postgres:
    image: postgres:16-alpine
    container_name: golf-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-golf_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-golf_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golf_local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - golf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golf_app} -d ${POSTGRES_DB:-golf_commerce}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  golf_postgres_data:
